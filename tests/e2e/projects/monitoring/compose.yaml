# cAdvisor and the node exporter as their documentation sets them up: both read the host's
# filesystems, devices and processes.
name: dockscreen-e2e-monitoring

services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8081:8080"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
    pid: host
    network_mode: host
    volumes:
      - /:/host:ro,rslave
