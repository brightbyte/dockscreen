# dockscreen configuration. Settings here override /etc/dockscreen/config.toml.
# The commented values are the defaults: uncomment a line to change it.
# Keep this file and its directories writable by you only, or dockscreen refuses to run.

# The user an image runs as when neither the service nor the command line chooses one, as numeric
# "uid:gid". Not set: the image's own user, if the id rules accept it. Its uid and gid also become
# allowed ids: a service may then name them itself, mounts or not. Set here, that holds for every
# service of every project; in an image or project section, only there.
#user = "1000:1000"

# The user that replaces an image's root user, as numeric "uid:gid".
#default_user = "65534:65534"

# The HOME of the default user when it replaces an image's root user: the image's own HOME is root's,
# which that user cannot write to. A HOME the command line, an env file or the service sets stays.
# "" leaves HOME as the image has it. The default user gets no HOME when it is root.
#default_home = "/tmp"

# Ids any project or image may use, with or without host mounts (inclusive).
#nobody_range = [65530, 65534]

# Absolute directories, besides the project, that bind mounts may come from.
#mount_dirs = []
#mount_dirs = ["/srv/shared-data"]

# Security options a service may have besides no-new-privileges, such as a seccomp profile.
#security_opts = []
#security_opts = ["seccomp=/etc/docker/seccomp-strict.json"]

# The real docker, as an absolute path. By default, the next docker on PATH that is not the wrapper.
#docker = "/usr/bin/docker"

# The settings above, except docker, for every image pulled from one repository (no tag). They apply
# after the ones above: a single value replaces, a list adds to.
#[images."mariadb"]
#user = "999:999"

# The same for a project directory and everything below it, after the image's section.
#[projects."/home/me/src/shop"]
#mount_dirs = ["/srv/shop-uploads"]
