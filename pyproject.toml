[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dockscreen"
version = "0.1.0"
description = "Wrapper around docker compose with modified behavior and extra subcommands"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
dockscreen = "dockscreen.docker_cli:main"
ddocker = "dockscreen.docker_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dockscreen = ["config.template.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["E501"]
